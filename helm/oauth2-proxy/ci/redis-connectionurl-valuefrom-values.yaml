# Test: connectionUrlValueFrom for redis standalone connection URL
# Provisions a real redis-ha instance and reads the connection URL from a ConfigMap
# at pod runtime via valueFrom.configMapKeyRef.
# Uses nameOverride on redis-ha to make the service name predictable.
sessionStorage:
  type: redis
  redis:
    clientType: standalone
    password: "foo"
    standalone:
      connectionUrlValueFrom:
        configMapKeyRef:
          name: redis-connection-config
          key: REDIS_HOST_URI

redis-ha:
  enabled: true
  fullnameOverride: "redis-fixed"
  redisPassword: "foo"
  replicas: 1
  sentinel:
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    startupProbe:
      enabled: false
    quorum: 1
  hardAntiAffinity: false
  redis:
    config:
      min-replicas-to-write: 0
      save: ""
      appendonly: "no"
    terminationGracePeriodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2
    startupProbe:
      initialDelaySeconds: 5
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 10
  splitBrainDetection:
    interval: 60
  persistentVolume:
    enabled: false
  emptyDir: {}
  haproxy:
    enabled: false
  exporter:
    enabled: false
  sysctlImage:
    enabled: false
  hostPath:
    chown: false

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: redis-connection-config
      namespace: "{{ .Release.Namespace }}"
    data:
      REDIS_HOST_URI: "redis://redis-fixed:6379"

initContainers:
  waitForRedis:
    enabled: true
