# Test: connectionUrlValueFrom for standalone redis
# Verifies that OAUTH2_PROXY_REDIS_CONNECTION_URL is read from a ConfigMap at runtime
# via valueFrom.configMapKeyRef when connectionUrlValueFrom is set.
# The ConfigMap and Secret are provisioned inline via extraObjects.
sessionStorage:
  type: redis
  redis:
    clientType: standalone
    existingSecret: "redis-test-secret"
    passwordKey: redis-password
    standalone:
      connectionUrlValueFrom:
        configMapKeyRef:
          name: redis-test-config
          key: REDIS_HOST_URI

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: redis-test-config
    data:
      REDIS_HOST_URI: "redis://localhost:6379"
  - apiVersion: v1
    kind: Secret
    metadata:
      name: redis-test-secret
    type: Opaque
    stringData:
      redis-password: "testpassword"
